{% load static i18n %}
<div class="section row mb-5" data-template="menu">
  <div class="col">
    <span class="heading">{% trans "Ports" %}</span>
    <a class="secondary btn" data-element="button_refresh_ports" type="button" role="button">
      <span class="icon icon-refresh"></span>
    </a>
  </div>
  <button type="button" class="primary col-md-auto btn ms-auto d-flex" style="margin-right: 10px;" data-element="button_add_virtual_port">
    <div class="row align-items-center">
      <div class="col label pe-0">{% trans "Add Virtual Port" %}</div>
      <div class="col-auto">
        <span class="icon icon-add"></span>
      </div>
    </div>
  </button>
  <button type="button" class="primary col-md-auto btn ms-auto d-flex" style="margin-right: 10px;" data-element="button_add_physical_port">
    <div class="row align-items-center">
      <div class="col label pe-0">{% trans "Add Physical Port" %}</div>
      <div class="col-auto">
        <span class="icon icon-add"></span>
      </div>
    </div>
  </button>
  <button type="button" class="primary col-md-auto btn ms-auto d-flex" data-element="button_add_logical_port">
    <div class="row align-items-center">
      <div class="col label pe-0">{% trans "Add Logical Port" %}</div>
      <div class="col-auto">
        <span class="icon icon-add"></span>
      </div>
    </div>
  </button>
</div>
