{% load static i18n %}

<div data-template="filter_rule_template_wizard" class="wizard wiz-step-1">
  <div class="rs-form wiz-step wiz-step-1">

  </div>
</div>

<form data-template="form_filter_rule_template_page"
  data-api-base="{% url "aclctl_api:filter_rule_template-list" org_tag=request.org.slug %}"
  data-api-action=""
  data-api-method="POST"
  >
  <div class="row controls" style="display:flex">
    <div class="col-12">

      <div class="row form-group">
        <div class="col-12" data-api-submit="yes">
          <label for="filter-rule-template-name">{% trans "Name" %}</label>
          <input type="text" class="form-control" id="filter-rule-template-name" name="name" />
        </div>
      </div>
      <h5>{% trans "Device type" %}</h5>
      <div class="row form-group">
        <div class="col-12" data-api-submit="yes">
          <label for="filter-rule-template-type">{% trans "Type" %}</label>
          <span class="modal-control">
          <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
          <select class="form-control" id="filter-rule-template-type" name="type">
            <option value="cisco-nexus">Cisco Nexus</option>
          <select>
          </span>
        </div>
      </div>

      <div class="row form-group" style="height:100%">
        <div class="col-12" data-api-submit="yes">
          <label for="filter-rule-template-body">{% trans "Template Body" %}</label>
          <textarea type="text" data-api-base="{% url "default-template" template_type="cisco-nexus" %}" value="32" style="height:93%" class="form-control" id="filter-rule-template-body" name="body" /></textarea>
        </div>
      </div>

    </div>
  </div>
  <div class="row controls marg-top-lg">
    <div class="col-6 left">
      <button data-element="filter_rule_template_delete"
        data-confirm="{% trans "Are you sure you want to delete this filter_rule_template?" %}"
        data-api-base="{% url "aclctl_api:filter_rule_template-list" org_tag=request.org.slug %}"
        data-api-action=""
        data-api-method="delete"><span class="icon fullctl icon-delete"></span><span class="label">{% trans "Delete" %}</span></a>
    </div>
    <div class="col-6 right">
      <button class="submit"><span class="icon fullctl icon-edit"></span><span class="label">{% trans "Save" %}</span></a>
    </div>
  </div>
</form>
