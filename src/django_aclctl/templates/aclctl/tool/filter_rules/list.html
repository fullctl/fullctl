{% load static i18n %}
<table
  class="table list-table"
  data-api-base="{% url "aclctl_api:filter_rule-list" org_tag=request.org.slug %}"
  data-template="list">
  <thead>
    <tr>
      <th>{% trans "Priority" %}</th>
      <th>{% trans "Source" %}</th>
      <th>{% trans "Port" %}</th>
      <th>{% trans "Destination" %}</th>
      <th>{% trans "Port" %}</th>
      <th></th>
    </tr>
  </thead>

  <tbody class="list-body">
  </tbody>

  <tbody class="list-footer">
    <tr>
      <td colspan="7">
        <button type="button" class="button aclctl rounded-button" data-element="button_add_filter_rule">
          <span class="icon fullctl icon-add"></span>
            {% trans "Add Filter Rule" %}
        </button>

      </td>
    </tr>
  </tbody>

  <tbody class="templates">
    <tr data-template="row" class="with-border">
      <td data-field="priority"></td>
      <td data-field="src_prefix"></td>
      <td data-field="src_port"></td>
      <td data-field="dest_prefix"></td>
      <td data-field="dest_port"></td>

      <td data-field="controls" class="right">
        <div class="row property">
          <div class="col-xs-12 col-lg-6">
            <a class="button" data-action="edit_filter_rule"><span class="icon ixctl icon-edit"></span><span class="label ixctl">{% trans "Edit" %}</span></a>
          </div>
          <div class="col-xs-12 col-lg-6">
            <a class="button"
              data-api-action="{id}"
              data-api-callback="remove"
              data-confirm="Remove Filter Rule?"
              data-api-method="DELETE"><span class="icon ixctl icon-delete"></span><span class="ixctl label">{% trans "Delete" %}</span>
            </a>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<div data-template="priority_inline_edit">
  <input
    type="text"
    class="slim"
    data-api-action
    data-api-method="PUT"
    data-api-base="{% url "aclctl_api:filter_rule-detail" org_tag=request.org.slug pk=0 %}"
  >
</div>


{% block "filter-rule-addon-template" %}
{% endblock %}
