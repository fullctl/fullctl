{% load static i18n %}
<table
  class="table list-table"
  data-api-base="{% url "aclctl_api:filter_rule-list" org_tag=request.org.slug %}"
  data-template="list">
  <thead>
    <tr>
      <th data-sort-target="src_port" data-sort-secondary="src_prefix,dest_prefix" class="sortable-button">{% trans "Source Port" %}</th>
      <th data-sort-target="src_prefix" data-sort-initial="yes" data-sort-secondary="src_port,dest_prefix"  class="sortable-button">{% trans "Source Prefix" %}</th>
      <th data-sort-target="dest_port" data-sort-secondary="dest_prefix,src_prefix" class="sortable-button">{% trans "Destination Port" %}</th>
      <th data-sort-target="dest_prefix" data-sort-secondary="dest_port,src_prefix" class="sortable-button">{% trans "Destination Prefix" %}</th>
      <th></th>
    </tr>
  </thead>

  <tbody class="list-body">
  </tbody>

  <tbody class="list-footer">
    <tr>
      <td colspan="4">
        <button type="button" class="button aclctl rounded-button" data-element="button_add_filter_rule">
          <span class="icon neon-green icon-add"></span>
            {% trans "Add Filter Rule" %}
        </button>

      </td>
    </tr>
  </tbody>

  <tbody class="templates">
    <tr data-template="row" class="with-border">
      <td data-field="src_port">
      </td>

      <td data-field="src_prefix">
      </td>

      <td data-field="dest_port">
      </td>

      <td data-field="dest_prefix">
      </td>

      <td data-field="controls" class="right">
        <div class="row property">
          <div class="col-xs-12 col-lg-6">
            <a class="button" data-action="edit_filter_rule"><span class="icon ixctl icon-edit"></span><span class="label ixctl">{% trans "Edit" %}</span></a>
          </div>
          <div class="col-xs-12 col-lg-6">
            <a class="button"
              data-api-action="{id}"
              data-api-callback="remove"
              data-confirm="Remove Filter Rule?"
              data-api-method="DELETE"><span class="icon ixctl icon-delete"></span><span class="ixctl label">{% trans "Delete" %}</span>
            </a>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>


{% block "prefix-set-addon-template" %}
{% endblock %}
