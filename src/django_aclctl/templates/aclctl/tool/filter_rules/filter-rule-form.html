{% load static i18n %}
<form data-template="form_filter_rule"
  data-api-base="{% url "aclctl_api:filter_rule-list" org_tag=request.org.slug %}"
  data-api-method="POST"
  >
  <div class="row form-group">
    <div class="col-12" data-api-submit="yes">
      <label for="name">{% trans "Source Port" %}</label>
      <input type="text" class="form-control" id="src-port" name="src_port" />
    </div>
  </div>
  <div class="row form-group">
    <div class="col-12" data-api-submit="yes">
      <label for="description">{% trans "Source Prefix" %}</label>
      <input type="text" class="form-control" id="src-prefix" name="src_prefix" />
    </div>
  </div>
  <div class="row form-group">
    <div class="col-12" data-api-submit="yes">
      <label for="irr-as-set">{% trans "Destination Port" %}</label>
      <input type="text" class="form-control" id="dest-port" name="dest_port" />
    </div>
  </div>
  <div class="row form-group">
    <div class="col-12" data-api-submit="yes">
      <label for="irr-sources">{% trans "Destination Prefix" %}</label>
      <input type="text" class="form-control" id="dest-prefix" name="dest_prefix" />
    </div>
  </div>
  <!--div class="row form-check">
    <div class="col-12" data-api-submit="yes">
      <input type="checkbox" class="form-check-input" id="irr-import" name="irr_import" />
      <label for="irr-import" class="form-check-label">{% trans "Automatic import from IRR" %}</label>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="alert alert-info">
       {% blocktrans %}
        Prefixes will be imported automatically - this is not instant, please give it a few
        minutes after enabling / changing these settings.
        {% endblocktrans %}
      </div>
    </div>
  </div-->
</form>
