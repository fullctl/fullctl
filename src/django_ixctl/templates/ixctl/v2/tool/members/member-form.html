{% load static i18n %}
<form data-template="form_member"
  data-api-base="{% url "ixctl_api:member-list" org_tag=request.org.slug ix_tag="default" %}"
  data-api-action=""
  data-api-method="POST"
  >
  <div class="container-fluid">
    {% if MEMBER_CASE_NUMBERS_ENABLED %}
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="case_number">{% trans "Case Number" %}</label>
        <input type="text" class="form-control" id="case_number" name="case_number" />
      </div>
    </div>
    {% endif %}
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-name">{% trans "Name" %}</label>
        <input type="text" class="form-control" id="member-name" name="name" />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-asn">{% trans "ASN" %}*</label>
        <input type="text" class="form-control" id="member-asn" name="asn" />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-state">{% trans "State" %}</label>
        <span class="modal-control">
        <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
        <select
          class="form-control"
          id="member-state"
          name="ixf_state"
          data-api-base="{% url "ixctl_api:member-list" org_tag=request.org.slug ix_tag="default" %}"
          data-api-action=""
          data-load-type="drf-choices"
          >
        </select>
        </span>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-type">{% trans "Member Type" %}</label>
        <span class="modal-control">
        <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
        <select
          class="form-control"
          id="member-type"
          name="ixf_member_type"
          data-api-base="{% url "ixctl_api:member-list" org_tag=request.org.slug ix_tag="default" %}"
          data-load-type="drf-choices"
          >
        <select>
        </span>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-ipaddr4">{% trans "IPv4 Address" %}</label>
        <input type="text" class="form-control" id="member-ipaddr4" name="ipaddr4" />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-ipaddr6">{% trans "IPv6 Address" %}</label>
        <input type="text" class="form-control" id="member-ipaddr6" name="ipaddr6" />
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="alert alert-info">
          {% blocktrans %}
          You can add multiple MAC addresses. Each MAC address must be on a new line.
          {% endblocktrans %}
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-macaddr">{% trans "MAC Addresses" %}</label>

        <textarea class="form-control" id="member-macaddr-set" name="macaddr_set" rows="3"></textarea>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-md5">{% trans "MD5" %}</label>
        <input type="text" class="form-control" id="member-md5" name="md5" />
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="member-as-macro">{% trans "AS Set" %}</label>
        <input type="text" class="form-control" id="member-as-macro" name="as_macro_override" />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <input type="checkbox" class="form-check-input" id="member-as-macro-negate" name="as_macro_negate" />
        <label for="member-as-macro-negate" class="form-check-label">{% trans "Negate AS Set" %}</label>
      </div>
    </div>


    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <input type="checkbox" class="form-check-input" id="member-is-rs-peer" name="is_rs_peer" />
        <label for="member-is-rs-peer" class="form-check-label">{% trans "Route Server" %}</label>
      </div>
    </div>

    <!-- port size, lag, port quantity in a single row 
    
    - port size (drop down from PORT_SIZES)
    - lag (checkbox)
    - port quantity (drop down from PORT_QUANTITIES)
    -->

    <div class="row mb-3">
      <div class="col-12">
        <h6>{% trans "Port Configuration" %}</h6>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-4" data-api-submit="yes">
        <label class="form-label" for="member-port-size">{% trans "Size" %}</label>
        <span class="modal-control">
          <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
          <select id="member-port-size" name="port_size" class="form-control">
            {% for size in select_ix.port_sizes %}
            <option value="{{ size }}">{{ size }}G</option>
            {% endfor %}
          </select>
        </span>
      </div>
      <div class="col-4" data-api-submit="yes">
        <input type="checkbox" class="form-check-input" id="member-lag" name="lag" />
        <label for="member-lag" class="form-check-label">{% trans "LAG" %}</label>
      </div>
      <div class="col-4" data-api-submit="yes">
        <label class="form-label" for="member-port-quantity">{% trans "Quantity" %}</label>
        <span class="modal-control">
          <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
          <select disabled id="member-port-quantity" name="port_quantity" class="form-control">
            {% for num in PORT_QUANTITIES %}
            <option value="{{ num }}">{{ num }}</option>
            {% endfor %}
          </select>
        </span>
      </div>
    </div>


    <!-- speed -->

    <div class="row mb-3">
      <div class="col-12">
        <span data-api-field="speed"></span>
      </div>
    </div>

    <!-- DEVICECTL REF -->

    <!-- devicectl logo -->
    <!-- <img src="{% static "common/logos/devicectl-dark.svg" %}"> -->
    <div data-element="devicectl_elements" data-api-base="{% url " ixctl_api:member-list" org_tag=request.org.slug
      ix_tag="default" %}" data-api-action="" data-api-method="GET" style="position:relative">
      <div class="row mb-3">
        <div class="col-12" data-api-submit="yes">
          <span class="modal-control">
            <label class="form-label" for="port">{% trans "Port" %}</label>
            <select
              class="form-control"
              id="port"
              data-type="int"
              name="port">
            </select>
          </span>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12" data-api-submit="yes">
        <label class="form-label" for="prefix-set">{% trans "PrefixCtl Prefix Set" %}</label>
        <span class="modal-control">
        <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
        <select
          class="form-control"
          id="prefix-set"
          name="prefix_set"
          data-api-base="{% url "proxies-api-prefixctl-list" org_tag=request.org.slug %}"
          >
        </select>
        </span>
      </div>
    </div>

  </div>
</form>
