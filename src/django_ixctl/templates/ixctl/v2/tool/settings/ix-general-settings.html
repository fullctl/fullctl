{% load static i18n %}
<form
  class="controls"
  data-template="form_general_settings"
  data-api-base="{% url "ixctl_api:ix-detail" org_tag=request.org.slug ix_tag="ix_tag" %}"
  data-api-method="PUT">

  <div class="row controls">
    <div class="col-12">
      <div class="mb-3">
        <div data-api-submit="yes">
          <label class="form-label" for="edit_ix_name">{% trans "Exchange Name" %}*</label>
          <input
            type="text"
            class="form-control mb-3"
            name="name"
            id="edit_ix_name">
          </input>
        </div>
        <div data-api-submit="yes">
          <label class="form-label" for="edit_ix_slug">{% trans "Exchange Identifier (also used as URL slug)" %}*</label>
          <input
            type="text"
            class="form-control mb-3"
            name="slug"
            id="edit_ix_slug">
          </input>
        </div>
        <div data-api-submit="yes">

          <div class="row">
            <div class="col-6">
              <!-- ix-f export privacy -->
              <label class="form-label" for="ixf_export_privacy">{% trans "IX-F Export Privacy Setting" %}</label>
              <span class="modal-control">
                <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
                <select class="form-control mb-3" id="ixf_export_privacy" name="ixf_export_privacy">
                  <option value="public">{% trans "Public (Anyone can view)" %}</option>
                  <option value="private">{% trans "Private (Requires secret key to view)" %}</option>
                </select>
              </span>
            </div>
            <div class="col-6">
              <!-- ixf id -->
              <label class="form-label" for="edit_ixf_id">{% trans "IX-F ID" %}</label>
              <input
                type="text"
                class="form-control mb-3"
                name="ixf_id"
                placeholder="0"
                id="edit_ixf_id">
              </input>
            </div>
          </div>
        </div>
        <div data-api-submit="yes">
          <label class="form-label" for="edit_ix_notes">{% trans "Notes" %}:</label>
          <textarea
            type="text"
            rows="10"
            class="form-control mb-3"
            name="notes"
            id="edit_ix_notes"
            placeholder="Supports Markdown Text">
          </textarea>
        </div>
        <div data-api-submit="yes">
          <label class="form-label" for="public_view">{% trans "Information Tab: Public View" %}</label>
          <span class="modal-control">
            <img class="caret" src="{% static "common/icons/ui-caret-caret/down.svg" %}">
            <select class="form-control mb-3" id="public_view" name="public_view">
              <option value="true" selected>{% trans "Anyone can view" %}</option>
              <option value="false">{% trans "Only authenticated users can view" %}</option>
            </select>
          </span>
        </div>
        <div data-api-submit="yes">
          <label class="form-label" for="urlkey">{% trans "Secret Key" %}*</label>
          <input
            type="text"
            class="form-control mb-3"
            name="urlkey"
            id="urlkey">
          </input>
        </div>
        <div data-api-submit="yes">
          <label class="form-label" for="edit_email_alert_recipients">{% trans "Email Alert Recipient Addresses" %}:</label>
          <textarea
            type="text"
            rows="3"
            class="form-control mb-3"
            name="email_alert_recipients"
            id="edit_email_alert_recipients"
            placeholder="Enter recipients email address, separate with a comma (,)">
          </textarea>
        </div>
      </div>
    </div>
  </div>
  <div class="row controls marg-top-lg">
    <div class="col-6 left">
    </div>
    <div class="col-6 right">
      <button class="submit primary btn">
        <div class="row align-items-center">
          <div class="col label pe-0">{% trans "Save" %}</div>
          <div class="col-auto">
            <span class="icon icon-edit"></span>
          </div>
        </div>
      </button>
    </div>
  </div>

</form>
