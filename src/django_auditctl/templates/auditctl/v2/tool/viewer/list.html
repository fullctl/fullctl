{% load static i18n %}
<table
  class="table table-borderless list-table"
  data-api-base="{% url "auditctl_api:audit-list" version="version" org_tag="org_tag" ref_tag="ref_tag" ref_id="ref_id" %}"
  data-api-action=""
  data-template="list">
  <thead>
    <tr>
      <th>{% trans "Object" %}</th>
      <th>{% trans "Status" %}</th>
      <th>{% trans "Source" %}</th>
      <th>{% trans "Time" %}</th>
    </tr>
  </thead>
  <tbody class="list-body">
  </tbody>
  <tbody class="templates">
    <tr data-template="row">
      <td data-field="object_id"></td>
      <td data-field="status"></td>
      <td data-field="source"></td>
      <td data-field="created"></td>
      <!--
      <td data-field="controls" class="right">
        <button class="btn">
          <span class="icon icon-options"></span>
        </button>
      </td>
      -->
    </tr>
    <tr data-template="row" class="secondary">
      <td data-field="data" colspan="2"></td>
      <td data-field="error" colspan="2"></td>
    </tr>
  </tbody>
</table>
