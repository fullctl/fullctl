{% load i18n %}
<div class="row">
  <div class="col-md-8 controls">
    <div class="col-md-auto">
      <div class="toolbar-control input-group searchbar">
        <select class="form-select action" data-element="event_version" style="max-width:50px" id="select-input">
          <option value="v0.1" selected>v0.1</option>
        </select>
        <span class="input-group-text static-label">{{ request.org.slug }}</span>
        <input type="text" class="form-control" data-element="event_search" value="{{ request.GET.q }}" aria-describedby="static-label">
        <button class="btn" data-element="button_refresh"><span class="icon fullctl icon-refresh"></span></button>
      </div>
    </div>
  </div>
</div>
<div class="row mt-3">
  <div class="col-auto">
    <div class="form-check form-check-inline mx-2">
      <input class="form-check-input" type="checkbox" id="filter-errors" {% if request.GET.error %}checked{% endif %}>
      <label class="form-check-label" for="filter-errors">
        <span class="badge bg-danger">error</span>
      </label>
    </div>
  </div>
  <div class="col-auto">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" id="filter-ok" {% if request.GET.ok %}checked{% endif %}>
      <label class="form-check-label" for="filter-ok">
        <span class="badge bg-success">ok</span>
      </label>
    </div>
  </div>
  <div class="col-auto">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" id="toggle-streaming" checked>
      <label class="form-check-label" for="toggle-streaming">
        stream updates <div id="indicate-streaming" style="display:none;" class="loading-indicator-container"><div class="loading-indicator"></div></div>
      </label>
    </div>
  </div>
</div>
