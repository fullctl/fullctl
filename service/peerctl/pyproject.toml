[project]
name = "peerctl"
# prep-release version 1.7.0-rc.3 (PEP 440 normalized)
version = "1.7.0-rc.7"
description = "ix control"
authors = [{ name = "20C", email = "code@20c.com" }]
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]

dependencies = [
  "fullctl",

  # netom (git branch pinned via [tool.uv.sources])
  "netom",
  "pydantic>=1.10.8",
  # pinned on prep-release (was [tool.poetry.dependencies] setuptools = ">=75,<82")
  "setuptools>=75,<82",
]

[project.urls]
Repository = "https://github.com/fullctl/peerctl"

[project.scripts]
peerctl = "peerctl.cli:main"

[dependency-groups]
dev = [
  # tests
  "coverage>=5",
  "pytest>=6",
  "pytest-django>=3.8",
  "pytest-cov",

  # linting
  # bandit>=1.6.2
  "black>=20",
  "isort>=5.7",
  "flake8>=3.8",
  "mypy>=0.950",
  "pre-commit>=2.13",
  "pyupgrade>=2.19",

  # docs
  "markdown",
  "markdown-include>=0.5,<1",
  "mkdocs>=1.2.3",

  # ctl (git source pinned via [tool.uv.sources])
  "ctl",
  "jinja2>=3",
  "tmpl>=1",
]

[tool.uv.sources]
fullctl = { workspace = true }
netom = { git = "https://github.com/20c/netom.git", branch = "prep-release" }
ctl = { git = "https://github.com/20c/ctl.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peerctl"]

[tool.isort]
profile = "black"
multi_line_output = 3
