<div class="row" data-template="as_graph">
    <div class="col-12  graph-controls" style="display:none">
        <div class="controls">
            <div class="row mb-3">
                <div class="col-6"></div>
                <div class="col-6 right">
                    <select class="form-control mb-3" id="date_range_select">
                        <option value="1">1 hour</option>
                        <option value="24" selected>24 hours</option>
                        <option value="168">7 days</option>
                        <option value="720">30 days</option>
                        <option value="current_month">Current Month</option>
                        <option value="last_month">Last Month</option>
                        <option value="2160">90 days</option>
                        <option value="8760">365 days</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="col-12">
                    <div id="member_graph_date_range" style="display: none;" class="right">
                        <input placeholder="Select start date" type="text" id="member_graph_start_date"
                            class="datepicker">
                        <input placeholder="Select end date" type="text" id="member_graph_end_date"
                            class="datepicker">
                    </div>
                </div>
            </div>

        </div>
        <div class="graph-container"
            data-element="graph_container"
            data-api-base="{% url "peerctl_api:port-list" asn=selected_asn %}">
            <!-- Traffic graphs -->
            <div class="graph-placeholder">
                <div class="loading-shim"></div>
            </div>
        </div>

        <div class="row mb-3 legend marg-top-lg">
            <div class="col-12 right">
                <button class="secondary col-md-auto btn ms-3" data-element="refresh_traffic_graph">
                    <div class="row align-items-center">
                        <div class="col label pe-0">Refresh</div>
                        <div class="col-auto">
                            <span class="icon icon-refresh"></span>
                        </div>
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>
