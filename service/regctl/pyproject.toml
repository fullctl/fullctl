[project]
name = "regctl"
# prep-release version 0.3.0-rc.3 (PEP 440 normalized)
version = "0.3.0-rc.7"
description = "Regctl"
readme = "README.md"
authors = [{ name = "20C", email = "code@20c.com" }]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "structlog>=24.4",
  "fastapi>=0.111",
  "uvicorn>=0.30.1",
  "httpx>=0.27.0",
  "phonenumbers>=8.13",
  "googlemaps>=4.10",
  "redis[hiredis]>=5.1.0,<6",
  # rdap (git branch pinned via [tool.uv.sources])
  "rdap",
]

[project.urls]
Repository = "https://github.com/fullctl/regctl"

[dependency-groups]
dev = [
  # testing
  "coverage>=5",
  "pytest>=6",
  "pytest-django>=3.8",
  "pytest-filedata>=0.4.0",
  "pytest-cov",
  "tox>=3.20",
  "tox-gh-actions>2.9.1",

  # linting
  "bandit>=1.6.2",
  "mypy>=0.950",
  "pre-commit>=2.13",
  "pyupgrade>=2.19",
  "ruff>=0.1",

  # docs
  "markdown",
  "markdown-include>=0.5,<1",
  "mkdocs>=1.2.3",
]

[tool.uv.sources]
# regctl does not depend on the fullctl core package; the workspace source is
# declared for convention parity with the other service members
fullctl = { workspace = true }
rdap = { git = "https://github.com/20c/rdap.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regctl"]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4
