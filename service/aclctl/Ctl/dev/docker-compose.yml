version: "3"
services:
  postgres:
    image: "postgres:14"
    env_file: .env
    logging:
      options:
        max-size: 100m
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    # image built by scripts/build.py (see docs/build.md); CI sets SERVICE_IMAGE
    image: ${SERVICE_IMAGE:-local/fullctl/aclctl:dev}
    command: "runserver 0.0.0.0:8000"
    user: root
    env_file: .env
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    logging:
      options:
        max-size: 100m
        max-file: "3"
    volumes:
      - ../../src:/srv/service/main:Z
    depends_on:
      - postgres

volumes:
  postgres_data:
