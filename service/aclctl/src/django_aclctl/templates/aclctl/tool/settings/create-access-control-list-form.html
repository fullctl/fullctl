  <div class="row controls">
    <div class="col-12">
      <div class="mb-3" data-api-submit="yes">

          type="text"
          class="form-control mb-3"
          name="slug"
          id="edit_ix_slug">
        </input>
      </div>
    </div>
  </div>

    <div class="col-6 left">
    </div>
