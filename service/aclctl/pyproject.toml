[project]
name = "aclctl"
# prep-release version 0.3.0-rc.3 (PEP 440 normalized)
version = "0.3.0-rc.7"
description = "acl control"
authors = [{ name = "20C", email = "code@20c.com" }]
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]

dependencies = [
  "fullctl",
]

[project.urls]
Repository = "https://github.com/fullctl/aclctl"

[project.scripts]
aclctl = "aclctl.cli:main"

[dependency-groups]
dev = [
  # testing
  "coverage>=5",
  "pytest>=6",
  "pytest-django>=3.8",
  "pytest-cov",
  "pytest-filedata>=0.4.0,<0.5",

  # linting
  # bandit>=1.6.2
  "black>=20",
  "isort>=5.7",
  "flake8>=3.8",
  "mypy>=0.950,<1.19",
  "pre-commit>=2.13",
  "pyupgrade>=2.19",

  # docs
  "markdown",
  "markdown-include>=0.5,<1",
  "mkdocs>=1.2.3,<2",

  # ctl (git source pinned via [tool.uv.sources])
  "ctl",
  "jinja2>=2",
  "tmpl>=1",
]

[tool.uv.sources]
fullctl = { workspace = true }
ctl = { git = "https://github.com/20c/ctl.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aclctl"]

[tool.isort]
profile = "black"
multi_line_output = 3
