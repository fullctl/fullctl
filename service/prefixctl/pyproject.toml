[project]
name = "prefixctl"
# prep-release version 1.5.0-rc.4 (PEP 440 normalized)
version = "1.5.0-rc.8"
description = "prefix control"
authors = [{ name = "20C", email = "code@20c.com" }]
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fullctl",
  "pygments>=2.14,<3",
  "rdap>=1.5,<2",
  "xmltodict>=0.13.0,<0.14",
  "structlog>=23.1.0",
  "pydantic>=2.6.3",
]

[project.urls]
Repository = "https://github.com/fullctl/prefixctl"

[project.scripts]
prefixctl = "prefixctl.cli:main"

[dependency-groups]
dev = [
  # testing
  "coverage>=5",
  "pytest>=6",
  "pytest-django>=3.8",
  "pytest-cov",

  # linting
  "bandit>=1.6.2",
  "mypy>=0.950,<1.19",
  "pre-commit>=2.13",
  "pyupgrade>=2.19",
  "ruff>=0.1",

  # additional testing
  "pytest-filedata<1",
  "pytest-mock>=3.2",

  # docs
  "markdown",
  "markdown-include>=0.5,<1",
  "mkdocs>=1.2.3",

  # ctl (git source pinned via [tool.uv.sources])
  "ctl",
  "tmpl>=1",
  "jinja2>=3",
]
# was the optional poetry "tasks" group; PEP 735 groups other than dev are
# not installed by a plain `uv sync` -- the tasks image build opts in via
# `uv sync --group tasks`
tasks = [
  # >= 1.45 currently breaks anchor links in PDFs
  # possibly related: https://github.com/puppeteer/puppeteer/issues/12869
  "playwright>=1.31.1,<1.45",
]

[tool.uv.sources]
fullctl = { workspace = true }
ctl = { git = "https://github.com/20c/ctl.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prefixctl"]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint.per-file-ignores]
# E402 = module import not at top level
"src/prefixctl/wsgi.py" = ["E402"]

# F821 = undefined variable
"src/prefixctl/settings/__init__.py" = ["F821"]
"src/prefixctl/settings/dev.py" = ["F821"]
