[tool.poetry]
name = "pdbctl"
version = "1.4.0-rc.44"
description = "allows other fullctl services to facilitate updates to and from PeeringDB"
readme = "README.md"
repository = "https://github.com/fullctl/pbctl"
authors = [ "20C <code@20c.com>",]
license = "Apache-2"


classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development"
]

# [tool.poetry.scripts]
# peerctl = "peerctl.cli:main"


[tool.poetry.dependencies]
python = "^3.9"
fullctl = { git = "https://github.com/fullctl/fullctl.git", branch = "prep-release" }

# django-peeringdb = ">=2.8"
django-peeringdb = { git = "https://github.com/peeringdb/django-peeringdb.git", branch = "main" }
peeringdb = ">=2.0.0"

[tool.poetry.dev-dependencies]
# testing
coverage = ">=5"
pytest = ">=6"
pytest-django = ">=3.8"
pytest-cov = "*"

# linting
# bandit = ">=1.6.2"
black = ">=20"
isort = ">=5.7"
flake8 = ">=3.8"
mypy = ">=0.950"
pre-commit = ">=2.13"
pyupgrade = ">=2.19"

# docs
markdown = "*"
markdown-include = ">=0.5,<1"
mkdocs = ">=1.2.3"

# ctl
ctl = ">=1"
jinja2 = ">=2"
tmpl = ">=1"

[tool.isort]
profile = "black"
multi_line_output = 3

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
