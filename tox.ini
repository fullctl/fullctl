[flake8]
extend-ignore = E203, E266, E501
exclude =
    .git,
    .venv,
    .tox,
    __pycache__,
    build,
    dist
# line length is intentionally set to 80 here because black uses Bugbear
# See https://github.com/psf/black/blob/master/docs/the_black_code_style.md#line-length for more details
max-line-length = 80
max-complexity = 18
select = B,C,E,F,W,T4,B9

# ignore unused import in __init__, used to pull into namespace
per-file-ignores =
    src/aclctl/settings/__init__.py:F821
    src/aclctl/settings/dev.py:F821
    src/aclctl/settings/dev_append.py:F821
    src/aclctl/wsgi.py:E402


[tox]
envlist = py37

[testenv]
extras = dev
deps =
  -r{toxinidir}/Ctl/requirements.txt
  -r{toxinidir}/Ctl/requirements-test.txt
commands =
  poetry install -v
  poetry run pytest -vs --cov={toxinidir}/src --cov-report=term-missing --cov-report=xml tests/

[pytest]
norecursedirs = .ctl data gen .tox
